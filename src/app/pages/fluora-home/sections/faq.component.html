<section class="fl-container fl-section" aria-labelledby="faq-title">
  <div class="fl-heading"><p class="fl-kicker">Preguntas frecuentes</p><h2 id="faq-title">¿Tienes dudas?</h2></div>
  <div class="fl-home-faq-list">@for(faq of faqs();track faq.id){<article><h3><button type="button" [id]="'faq-button-'+faq.id" [attr.aria-expanded]="open()===faq.id" [attr.aria-controls]="'faq-answer-'+faq.id" (click)="toggle(faq.id)"><span>{{faq.question}}</span><i [class]="open()===faq.id?'bi bi-dash-lg':'bi bi-plus-lg'" aria-hidden="true"></i></button></h3><div class="fl-home-faq-answer" [id]="'faq-answer-'+faq.id" role="region" [attr.aria-labelledby]="'faq-button-'+faq.id" [hidden]="open()!==faq.id"><p>{{faq.answer}}</p>@if(faq.id==='precio'||faq.id==='tienda'){<a href="#planes">Consultar planes <i class="bi bi-arrow-right" aria-hidden="true"></i></a>}</div></article>}
    @if(support();as contact){<article><h3><button type="button" id="faq-button-soporte" [attr.aria-expanded]="open()==='soporte'" aria-controls="faq-answer-soporte" (click)="toggle('soporte')"><span>¿Cómo puedo contactar con soporte?</span><i [class]="open()==='soporte'?'bi bi-dash-lg':'bi bi-plus-lg'" aria-hidden="true"></i></button></h3><div class="fl-home-faq-answer" id="faq-answer-soporte" role="region" aria-labelledby="faq-button-soporte" [hidden]="open()!=='soporte'"><p>Atendemos {{schedule(contact)}}. Escríbenos a <a [href]="'mailto:'+contact.correo">{{contact.correo}}</a> o llama al <a [href]="'tel:'+contact.telefono">{{contact.telefono}}</a>.</p></div></article>}
  </div>
</section>
