<div class="caja-control-strip">
  @if (vistas.length > 1) {
    <nav class="caja-view-switcher" aria-label="Secciones de caja" [style.--caja-nav-count]="vistas.length">
      @for (vista of vistas; track vista.id) {
        <button type="button" class="caja-view-chip" [class.active]="vistaActiva === vista.id" (click)="viewSelected.emit(vista.id)">
          @switch (vista.id) {
            @case ('venta') { <i class="bi bi-bag-check" aria-hidden="true"></i> }
            @case ('cobros') { <i class="bi bi-calendar2-check" aria-hidden="true"></i> }
            @case ('sesion') { <i class="bi bi-safe2" aria-hidden="true"></i> }
            @case ('movimientos') { <i class="bi bi-arrow-left-right" aria-hidden="true"></i> }
          }
          <span>{{ vista.label }}</span>
        </button>
      }
    </nav>
  }
  @if (cobroActivo; as cita) {
    <div class="caja-inline-context"><span class="caja-inline-context-label">Cobro activo</span><strong>{{ cita.clienteNombre }}</strong><small>{{ cita.servicioNombre }} · {{ cita.pendiente | appMoney:cita.moneda:2:2 }}</small></div>
  }
</div>
