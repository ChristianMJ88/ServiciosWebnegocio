<section class="caja-shell">
  <app-caja-header
    [panelMovil]="panelMovil()" [puedeIrRecepcion]="puedeIrRecepcion()" [puedeIrAdmin]="puedeIrAdmin()"
    [notificaciones]="notificacionesCaja()" [totalNotificaciones]="totalNotificaciones()"
    [nombreUsuario]="nombreUsuario()" [correoUsuario]="correoUsuario()" [puestoUsuario]="puestoUsuario()"
    [fotoPerfilUsuario]="fotoPerfilUsuario()" [inicialesUsuario]="inicialesUsuario()" [perfilConfigAbierto]="perfilConfigAbierto()"
    (refresh)="recargarTablero()" (openProfile)="abrirConfiguracionPerfil()" (closeProfile)="cerrarConfiguracionPerfil()"
    (saveProfile)="guardarConfiguracionPerfil($event)" (profileValidationError)="mostrarErrorPerfil($event)"
    (goReception)="irARecepcion()" (goAdmin)="irAAdmin()" (signOut)="logout()" />

  @if (loading()) {
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  }

  <div class="caja-body">
    <app-caja-overview
      [totalNotificaciones]="totalNotificaciones()" [estadoSesionEtiqueta]="estadoSesionEtiqueta()"
      [cajaAbierta]="cajaAbierta()" [sucursalActivaId]="sucursalOperativaId()"
      [sucursalActivaNombre]="sucursalActivaNombre()" [sucursalActivaDireccion]="sucursalActivaDireccion()"
      [sucursalActivaResuelta]="sucursalActivaResuelta()" [sucursales]="sucursales()"
      [citasPorCobrar]="citasPorCobrar().length" [metricas]="metricas()" [error]="error()" [mensaje]="mensaje()"
      (branchSelected)="seleccionarSucursal($event)" />

    <app-caja-view-navigation [vistas]="vistasDisponibles()" [vistaActiva]="vistaActiva()"
      [cobroActivo]="citaSeleccionada()" (viewSelected)="seleccionarVista($event)" />

    @if (vistaActiva() === 'cobros') {
      <app-caja-payments-section
        [citas]="citasPorCobrar()"
        [citaSeleccionadaId]="citaSeleccionadaActualId()"
        [citaSeleccionada]="citaSeleccionada()"
        [formularioPago]="formularioPago"
        [metodosPago]="metodosPago()"
        [metodoPagoEfectivo]="metodoPagoEfectivo()"
        [pagos]="pagosCitaSeleccionada()"
        [guardando]="guardandoPago()"
        [cajaAbierta]="cajaAbierta()"
        [mensajeBloqueo]="mensajePagoBloqueado()"
        (selectAppointment)="seleccionarCita($event)"
        (savePayment)="registrarPago()"
        (printReceipt)="imprimirComprobante()" />
    }

    @if (vistaActiva() === 'sesion') {
      <app-caja-session-section
        [cajaAbierta]="cajaAbierta()"
        [sesion]="sesionActual()"
        [resumen]="resumen()"
        [puedeGestionar]="puedeGestionarSesion()"
        [formularioApertura]="formularioApertura"
        [formularioCierre]="formularioCierre"
        [guardandoApertura]="guardandoApertura()"
        [guardandoCierre]="guardandoCierre()"
        (openSession)="abrirCaja()"
        (closeSession)="cerrarCaja()" />
    }

    @if (vistaActiva() === 'movimientos') {
      <app-caja-movements-section
        [puedeGestionar]="puedeGestionarMovimientos()"
        [cajaAbierta]="cajaAbierta()"
        [guardando]="guardandoMovimiento()"
        [formulario]="formularioMovimiento"
        [tiposMovimiento]="tiposMovimiento()"
        [metodosPago]="metodosPago()"
        [estadosSesion]="estadosSesion()"
        [estadoSesion]="cajaAbierta() ? estadoSesionAbierta() : estadoSesionCerrada()"
        [movimientos]="movimientosDelTurno()"
        [ultimoMovimiento]="ultimoMovimiento()"
        [resumen]="resumen()"
        (saveMovement)="registrarMovimiento()" />
    }
  </div>
</section>
<app-caja-receipt [receipt]="comprobante()" />
